<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TryHackMe Rooms | Bisc's Security Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c10;
            --card-bg: #0d121d;
            --accent-green: #00ff88;
            --accent-cyan: #00e5ff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #1f293d;
            --code-bg: #05080c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 300px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: fixed;
            height: 100vh;
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 1rem;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 15px;
            object-fit: cover;
            border: 2px solid var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .profile-name {
            font-family: 'Fira Code', monospace;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 0.2rem;
        }

        .profile-rank {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            margin-bottom: 0.8rem;
        }

        .profile-bio {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .nav-links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: auto;
        }

        .nav-btn {
            display: block;
            text-align: left;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-decoration: none;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            transition: 0.2s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.05);
        }

        .social-links {
            width: 100%;
            margin-top: 1rem;
        }

        .btn-external {
            display: block;
            text-align: center;
            padding: 0.6rem;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            text-decoration: none;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            transition: 0.2s ease;
        }

        .btn-external:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .main-content {
            margin-left: 300px;
            flex: 1;
            padding: 3rem;
            max-width: 900px;
        }

        .breadcrumbs {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .breadcrumbs a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        .breadcrumbs a:hover {
            text-decoration: underline;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 0.8rem;
        }

        .room-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem 1rem;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 85px;
        }

        .room-card:hover {
            border-color: var(--accent-green);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.15);
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .room-title {
            color: #fff;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .badge-easy {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .badge-medium {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            color: #ffb703;
            background: rgba(255, 183, 3, 0.1);
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid rgba(255, 183, 3, 0.2);
        }

        .badge-hard {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            color: #ff0055;
            background: rgba(255, 0, 85, 0.1);
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid rgba(255, 0, 85, 0.2);
        }

        .room-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="avatar-container">
            <img src="../../avatar.jpeg" alt="Bisc Profile Picture" class="avatar">
        </div>
        <h2 class="profile-name">Bisc</h2>
        <p class="profile-rank">[0x8][HACKER]</p>
        <p class="profile-bio">I love biscuits 🙃🍪</p>

        <nav class="nav-links">
            <a href="../../index.html" class="nav-btn">~/home</a>
            <a href="../index.html" class="nav-btn active">~/ctf</a>
            <a href="../../about/index.html" class="nav-btn">~/about</a>
        </nav>

        <div class="social-links">
            <a href="https://tryhackme.com/p/Bisc" target="_blank" class="btn-external">TryHackMe Profile</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="breadcrumbs">
            <a href="../../index.html">home</a> / <a href="../index.html">ctf</a> / <span style="color: var(--text-main);">tryhackme</span>
        </div>

        <div class="page-header">
            <h1>// TryHackMe Rooms</h1>
            <p>Collection of completed rooms, web exploits, and machine walkthroughs.</p>
        </div>

        <div class="rooms-grid">
            
            <a href="Agent-T/index.html" class="room-card">
                <div class="room-header">
                    <span class="room-title">Agent T</span>
                    <span class="badge-easy">Easy</span>
                </div>
                <div class="room-tag">PHP 8.1.0-dev RCE</div>
            </a>

            <!-- To add a new room cards easily like this in the future: -->
            <!-- 
            <a href="/ctf/tryhackme/RoomName/" class="room-card">
                <div class="room-header">
                    <span class="room-title">Room Name</span>
                    <span class="badge-easy">Easy</span>
                </div>
                <div class="room-tag">Exploit Type</div>
            </a>
            -->

        </div>
    </main>

</body>
</html>
